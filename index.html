<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konnichiwa! 🐾</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #4361EE;
            --light-blue: #A2E4F9;
            --yellow: #F9C80E;
            --pink: #F72585;
            --card-bg: #FFFFFF;
            --border-color: #1A1A1A;
            --text-color: #1A1A1A;
            --text-bg-jp: var(--yellow);
            --text-bg-en: var(--pink);
            --text-bg-mn: var(--blue);
            --bg-grid: rgba(67, 97, 238, 0.3);
            --btn-text: var(--text-color);
        }

        [data-theme="dark"] {
            --light-blue: #0F0F0F;
            --blue: #4CC9F0;
            --yellow: #F9C80E;
            --pink: #F72585;
            --card-bg: #1A1A1A;
            --border-color: #F8F9FA;
            --text-color: #F8F9FA;
            --text-bg-jp: var(--yellow);
            --text-bg-en: var(--pink);
            --text-bg-mn: var(--blue);
            --bg-grid: rgba(248, 249, 250, 0.15);
            --btn-text: #1A1A1A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--light-blue);
            background-image: 
                linear-gradient(var(--bg-grid) 2px, transparent 2px),
                linear-gradient(90deg, var(--bg-grid) 2px, transparent 2px);
            background-size: 50px 50px;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Dark / Light Toggle Button */
        #theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 4px solid var(--border-color);
            padding: 10px 15px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--border-color);
            border-radius: 8px;
            z-index: 100;
            transform: rotate(2deg);
        }

        #theme-toggle:hover {
            transform: scale(1.05) rotate(-2deg);
            background-color: var(--yellow);
            color: #1A1A1A;
        }
        
        #theme-toggle:active {
            transform: scale(0.95);
            box-shadow: 2px 2px 0px var(--border-color);
        }

        /* Background Animated Paws & Shapes */
        #bg-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-shape {
            position: absolute;
            opacity: 0.8;
            stroke: var(--border-color);
            stroke-width: 4px;
            fill: none;
            animation: floatUp 15s linear infinite;
        }

        .floating-paw {
            position: absolute;
            font-size: 2rem;
            opacity: 0.4;
            animation: floatUp linear infinite;
            filter: drop-shadow(2px 2px 0px var(--border-color));
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Main Card Layout */
        .card {
            position: relative;
            z-index: 10;
            background-color: var(--card-bg);
            border: 6px solid var(--border-color);
            border-radius: 12px; /* Harder corners for robust feel */
            padding: 60px 40px 40px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 15px 15px 0px var(--border-color);
            transform: rotate(-1.5deg);
            transition: transform 0.3s ease;
            margin-top: 50px;
        }

        .card:hover {
            transform: rotate(0deg) scale(1.01);
        }

        /* --- CSS Built Cute Cat --- */
        .cat-wrapper {
            position: absolute;
            top: -90px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 120px;
            z-index: 15;
            pointer-events: none;
        }

        .cat-head {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 90px;
            background-color: var(--yellow);
            border: 5px solid var(--border-color);
            border-radius: 50px 50px 40px 40px;
            z-index: 3;
        }

        .cat-ear {
            position: absolute;
            top: 5px;
            width: 40px;
            height: 50px;
            background-color: var(--yellow);
            border: 5px solid var(--border-color);
            z-index: 2;
        }

        .cat-ear::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 30px;
            background-color: var(--pink);
            border: 4px solid var(--border-color);
            border-bottom: none;
            border-radius: 16px 16px 0 0;
        }

        .left-ear {
            left: 8px;
            border-radius: 40px 0 0 0;
            transform: rotate(-25deg);
            transform-origin: bottom right;
            animation: ear-wiggle-left 3s infinite;
        }

        .right-ear {
            right: 8px;
            border-radius: 0 40px 0 0;
            transform: rotate(25deg);
            transform-origin: bottom left;
            animation: ear-wiggle-right 3.5s infinite;
        }

        @keyframes ear-wiggle-left {
            0%, 80%, 100% { transform: rotate(-25deg); }
            90% { transform: rotate(-40deg); }
        }

        @keyframes ear-wiggle-right {
            0%, 75%, 100% { transform: rotate(25deg); }
            85% { transform: rotate(40deg); }
        }

        .cat-eyes {
            position: absolute;
            top: 35px;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
        }

        /* Eye tracking support */
        .cat-eye {
            width: 22px;
            height: 26px;
            background-color: var(--card-bg);
            border: 4px solid var(--border-color);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            animation: blink 4s infinite;
        }

        .pupil {
            position: absolute;
            width: 12px;
            height: 14px;
            background-color: var(--border-color);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* Smooth tracking */
            transition: transform 0.1s ease-out, background-color 0.3s ease;
        }

        @keyframes blink {
            0%, 46%, 48%, 100% { transform: scaleY(1); }
            47%, 49% { transform: scaleY(0.1); }
        }

        .cat-nose {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 12px;
            background-color: var(--pink);
            border: 3px solid var(--border-color);
            border-radius: 50%;
        }

        .cat-mouth {
            position: absolute;
            top: 63px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 12px;
            border-bottom: 4px solid var(--border-color);
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-radius: 50%;
        }

        .cat-whiskers {
            position: absolute;
            top: 45px;
            width: 25px;
            height: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .left-whiskers { left: -15px; }
        .right-whiskers { right: -15px; }

        .whisker {
            width: 100%;
            height: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
        }

        .left-whiskers .whisker:first-child { transform: rotate(10deg); }
        .left-whiskers .whisker:last-child { transform: rotate(-10deg); }
        .right-whiskers .whisker:first-child { transform: rotate(-10deg); }
        .right-whiskers .whisker:last-child { transform: rotate(10deg); }

        .cat-tail {
            position: absolute;
            bottom: 20px;
            right: -20px;
            width: 60px;
            height: 50px;
            border-bottom: 8px solid var(--border-color);
            border-right: 8px solid var(--border-color);
            border-radius: 0 0 40px 0;
            transform-origin: left center;
            animation: tail-wag 2s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes tail-wag {
            0% { transform: rotate(10deg); }
            100% { transform: rotate(35deg); }
        }

        /* --- Content Layout --- */
        .title-text {
            font-size: 2.3rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .title-text span {
            display: inline-block;
            padding: 4px 18px;
            border: 4px solid var(--border-color);
            border-radius: 4px; /* brutalism square-ish */
            box-shadow: 5px 5px 0px var(--border-color);
            position: relative;
        }

        /* Glitch Hover Effect */
        .glitch-hover {
            position: relative;
            cursor: default;
        }
        
        .glitch-hover:hover {
            animation: hoverGlitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        @keyframes hoverGlitch {
            0% { transform: translate(0) scale(1) rotate(0deg); }
            20% { transform: translate(-3px, 3px) scale(1.02) rotate(-1deg); }
            40% { transform: translate(-3px, -3px) scale(0.98) rotate(1deg); }
            60% { transform: translate(3px, 3px) scale(1.02) rotate(-1deg); }
            80% { transform: translate(3px, -3px) scale(0.98) rotate(1deg); }
            100% { transform: translate(0) scale(1) rotate(0deg); }
        }

        .lang-jp { background-color: var(--text-bg-jp); color: #1A1A1A; transform: rotate(-3deg); }
        .lang-en { background-color: var(--text-bg-en); color: #FFFFFF; transform: rotate(2deg); }
        .lang-mn { background-color: var(--text-bg-mn); color: #FFFFFF; transform: rotate(-1deg); }
        
        /* Enforce internal text color for these blocks regardless of theme */
        [data-theme="dark"] .lang-jp { color: #1A1A1A; }
        [data-theme="dark"] .lang-en { color: #1A1A1A; }
        [data-theme="dark"] .lang-mn { color: #1A1A1A; }

        .secondary-box {
            background-color: var(--card-bg);
            border: 4px solid var(--border-color);
            padding: 15px;
            margin: 20px auto 25px;
            box-shadow: 6px 6px 0px var(--border-color);
            border-radius: 8px; /* blocky */
            transform: rotate(1deg);
            max-width: 90%;
        }

        .secondary-box p {
            font-weight: 700;
            font-size: 1.05rem;
            margin: 8px 0;
            color: var(--text-color);
        }

        p.funny {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--text-color);
            margin-bottom: 35px;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 1px;
            transform: rotate(-2deg);
        }

        /* --- Button & Interactions --- */
        #click-me-btn {
            background-color: var(--yellow);
            color: var(--btn-text);
            font-family: inherit;
            font-size: 1.6rem;
            font-weight: 900;
            padding: 15px 40px;
            border: 5px solid var(--border-color);
            border-radius: 8px; /* Blocky Brutalism */
            box-shadow: 8px 8px 0px var(--border-color);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform: rotate(-2deg);
        }

        #click-me-btn:hover {
            transform: scale(1.05) rotate(2deg);
            background-color: var(--pink);
            color: #FFFFFF;
            box-shadow: 10px 10px 0px var(--border-color);
        }

        [data-theme="dark"] #click-me-btn:hover {
            color: #1A1A1A;
        }

        /* Micro-interaction Button Squish */
        #click-me-btn:active {
            transform: scale(0.9, 1.1) translate(4px, 4px) rotate(0deg);
            box-shadow: 2px 2px 0px var(--border-color);
            background-color: var(--blue);
        }

        /* Click Glitch */
        .glitch-active {
            animation: click-glitch-anim 0.3s cubic-bezier(.25, .46, .45, .94) both;
        }

        @keyframes click-glitch-anim {
            0% { transform: translate(0) skew(0deg) }
            20% { transform: translate(-5px, 5px) skew(10deg) }
            40% { transform: translate(-5px, -5px) skew(-10deg) }
            60% { transform: translate(5px, 5px) skew(5deg) }
            80% { transform: translate(5px, -5px) skew(-5deg) }
            100% { transform: translate(0) skew(0deg) }
        }

        .emoji-rain {
            position: fixed;
            pointer-events: none;
            z-index: 100;
            filter: drop-shadow(4px 4px 0px var(--border-color));
        }

        @keyframes fall {
            0% { top: -50px; transform: rotate(0deg) scale(1); opacity: 1; }
            80% { opacity: 1; }
            100% { top: 100vh; transform: rotate(360deg) scale(1.5); opacity: 0; }
        }

        @media (max-width: 600px) {
            .title-text { font-size: 1.8rem; }
            .secondary-box p { font-size: 0.95rem; }
            #click-me-btn { font-size: 1.3rem; padding: 12px 25px; }
            .card { padding: 50px 20px 30px; margin-top: 50px; border-radius: 8px;}
        }
    </style>
</head>
<body>

    <button id="theme-toggle">🌙 Dark Mode</button>

    <div id="bg-elements"></div>

    <div class="card">
        <div class="cat-wrapper">
            <div class="cat-tail"></div>
            <div class="cat-ear left-ear"></div>
            <div class="cat-ear right-ear"></div>
            <div class="cat-head">
                <div class="cat-eyes">
                    <div class="cat-eye left-eye"><div class="pupil"></div></div>
                    <div class="cat-eye right-eye"><div class="pupil"></div></div>
                </div>
                <div class="cat-nose"></div>
                <div class="cat-mouth"></div>
                <div class="cat-whiskers left-whiskers">
                    <div class="whisker"></div>
                    <div class="whisker"></div>
                </div>
                <div class="cat-whiskers right-whiskers">
                    <div class="whisker"></div>
                    <div class="whisker"></div>
                </div>
            </div>
        </div>

        <div class="content" id="greeting-content">
            <h1 class="bounce-target title-text">
                <span class="lang-jp glitch-hover">「こんにちは！」</span>
                <span class="lang-en glitch-hover">Konnichiwa!</span>
                <span class="lang-mn glitch-hover">Сайн байна уу!</span>
            </h1>
            
            <div class="secondary-box bounce-target">
                <p>「今日は素敵な一日になりますように」</p>
                <p>Kyou wa suteki na ichinichi ni narimasu you ni</p>
                <p>Өнөөдөр гайхалтай өдөр байг!</p>
            </div>

            <p class="funny">I hope your day is purr-fect!</p>
            
            <button id="click-me-btn">🐾 Click me!</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('click-me-btn');
            const bounceTargets = document.querySelectorAll('.bounce-target');
            const themeToggle = document.getElementById('theme-toggle');
            
            // Toggle Theme
            themeToggle.addEventListener('click', () => {
                const currentTheme = document.body.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    document.body.removeAttribute('data-theme');
                    themeToggle.innerText = '🌙 Dark Mode';
                } else {
                    document.body.setAttribute('data-theme', 'dark');
                    themeToggle.innerText = '☀️ Light Mode';
                }
            });

            // Cat Eyes Follow Cursor
            const eyes = document.querySelectorAll('.cat-eye');
            document.addEventListener('mousemove', (e) => {
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                
                eyes.forEach(eye => {
                    const rect = eye.getBoundingClientRect();
                    const eyeCenterX = rect.left + rect.width / 2;
                    const eyeCenterY = rect.top + rect.height / 2;
                    
                    const angle = Math.atan2(mouseY - eyeCenterY, mouseX - eyeCenterX);
                    // Calculate pupil distance with bounds
                    const distance = Math.min(4, Math.hypot(mouseX - eyeCenterX, mouseY - eyeCenterY) / 10);
                    
                    const pupil = eye.querySelector('.pupil');
                    const dx = Math.cos(angle) * distance;
                    const dy = Math.sin(angle) * distance;
                    
                    pupil.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                });
            });

            // Generate floating background paws and geometric abstract shapes
            const bgContainer = document.getElementById('bg-elements');
            
            function createFloatingElement() {
                const isShape = Math.random() > 0.6;
                const el = document.createElement(isShape ? 'svg' : 'div');
                
                if (isShape) {
                    el.classList.add('floating-shape');
                    el.setAttribute('viewBox', '0 0 50 50');
                    el.setAttribute('width', (Math.random() * 40 + 20) + 'px');
                    el.setAttribute('height', el.getAttribute('width'));
                    
                    // Create basic abstract geometries
                    const type = Math.floor(Math.random() * 3);
                    const path = document.createElementNS('http://www.w3.org/2000/svg', type === 0 ? 'circle' : type === 1 ? 'rect' : 'polygon');
                    if (type === 0) {
                        path.setAttribute('cx', '25'); path.setAttribute('cy', '25'); path.setAttribute('r', '20');
                    } else if (type === 1) {
                        path.setAttribute('x', '5'); path.setAttribute('y', '5'); path.setAttribute('width', '40'); path.setAttribute('height', '40');
                    } else {
                        path.setAttribute('points', '25,5 45,45 5,45');
                    }
                    el.appendChild(path);
                } else {
                    el.classList.add('floating-paw');
                    el.innerText = ['🐾', '🦴', '✨', '⚡️'][Math.floor(Math.random() * 4)];
                    el.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';
                }
                
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 15 + 10) + 's';
                el.style.animationDelay = (Math.random() * 5) + 's';
                bgContainer.appendChild(el);
            }

            for (let i = 0; i < 20; i++) {
                createFloatingElement();
            }

            // High-quality public cat meow
            const playMeow = () => {
                const audio = new Audio('https://actions.google.com/sounds/v1/animals/cat_meow.ogg');
                audio.volume = 0.5;
                audio.play().catch(e => console.log('Audio autoplay prevented. Interaction needed.'));
            };

            btn.addEventListener('click', () => {
                playMeow();
                
                // Add click glitch logic
                bounceTargets.forEach(el => {
                    el.classList.remove('glitch-active');
                    void el.offsetWidth; // reset animation
                    el.classList.add('glitch-active');
                    
                    setTimeout(() => {
                        el.classList.remove('glitch-active');
                    }, 350); 
                });

                createEmojiRain();
            });

            function createEmojiRain() {
                const emojis = ['😺', '😸', '😹', '😻', '😼', '😽', '🙀', '😿', '😾', '🐈', '🐈‍⬛', '🐾', '💥', '🎈', '🧶'];
                const count = Math.floor(Math.random() * 12) + 15; 

                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const el = document.createElement('div');
                        el.className = 'emoji-rain';
                        el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                        el.style.left = Math.random() * 100 + 'vw';
                        el.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
                        
                        const duration = Math.random() * 1.5 + 1;
                        el.style.animation = `fall ${duration}s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards`;
                        
                        document.body.appendChild(el);
                        
                        setTimeout(() => {
                            el.remove();
                        }, duration * 1000);
                    }, i * 40); 
                }
            }
        });
    </script>
</body>
</html>
