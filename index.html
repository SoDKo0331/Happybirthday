<!DOCTYPE html>
<html lang="mn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Төрсөн өдрийн мэнд хүргэе</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff1f7;
      --surface: #ffffff;
      --surface2: #ffe0ef;
      --text: #4a2436;
      --pink: #ff69a6;
      --hot: #ff2f86;
      --soft: #ffc6dc;
      --cream: #fff8dd;
      --mint: #b9f7df;
      --grid: rgba(255, 105, 166, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Baloo 2', cursive;
      color: var(--text);
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        radial-gradient(circle at 20% 18%, rgba(255, 198, 220, 0.75), transparent 34%),
        radial-gradient(circle at 80% 90%, rgba(185, 247, 223, 0.45), transparent 30%),
        var(--bg);
      background-size: 42px 42px, 42px 42px, auto, auto, auto;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,0.45) 1px, transparent 1px);
      background-size: 18px 18px;
      opacity: 0.4;
      z-index: 5;
    }

    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      opacity: 0.42;
      animation: drift linear infinite;
      user-select: none;
      filter: drop-shadow(0 4px 6px rgba(255, 47, 134, 0.18));
    }

    @keyframes drift {
      from { transform: translateY(110vh) rotate(0deg) scale(0.9); }
      to { transform: translateY(-20vh) rotate(360deg) scale(1.08); }
    }

    .stage {
      position: relative;
      z-index: 10;
      width: min(520px, 94vw);
      margin-top: 60px;
    }

    .cat-head {
      position: absolute;
      top: -118px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 210px;
      height: 145px;
      background: var(--surface);
      border: 4px solid var(--text);
      border-radius: 46% 46% 40% 40%;
      box-shadow: 8px 8px 0 var(--pink);
      animation: sway 4.5s ease-in-out infinite;
      z-index: 20;
    }

    .cat-head::before,
    .cat-head::after {
      content: "";
      position: absolute;
      top: -34px;
      width: 72px;
      height: 72px;
      background: var(--surface);
      border: 4px solid var(--text);
      transform: rotate(45deg);
      border-radius: 12px;
      z-index: -1;
    }

    .cat-head::before { left: 18px; }
    .cat-head::after { right: 18px; }

    .cat-face {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .cat-eyes {
      width: 116px;
      display: flex;
      justify-content: space-between;
      font-size: 2rem;
      line-height: 1;
    }

    .cat-nose {
      width: 18px;
      height: 14px;
      background: var(--hot);
      border-radius: 50% 50% 60% 60%;
      transform: rotate(45deg);
      margin-top: -2px;
    }

    .cat-mouth {
      font-size: 1.1rem;
      margin-top: -4px;
    }

    @keyframes sway {
      0%, 100% { transform: translateX(-50%) rotate(-3deg); }
      50% { transform: translateX(-52%) rotate(3deg); }
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 56px 34px 42px;
      background: linear-gradient(180deg, var(--surface), var(--surface2));
      border: 4px solid var(--text);
      border-radius: 34px;
      box-shadow: 12px 12px 0 var(--pink);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px dashed rgba(255, 105, 166, 0.55);
      border-radius: 24px;
      pointer-events: none;
    }

    .paw {
      position: absolute;
      color: var(--pink);
      opacity: 0.85;
      font-size: 1.25rem;
      z-index: 3;
    }

    .paw.tl { top: 16px; left: 18px; transform: rotate(-18deg); }
    .paw.tr { top: 16px; right: 18px; transform: rotate(18deg); }
    .paw.bl { bottom: 16px; left: 18px; transform: rotate(12deg); }
    .paw.br { bottom: 16px; right: 18px; transform: rotate(-12deg); }

    .yarn {
      position: absolute;
      left: -45px;
      top: 53%;
      transform: translateY(-50%);
      width: 110px;
      height: 110px;
      background: var(--pink);
      border-radius: 50%;
      border: 4px solid var(--text);
      box-shadow: 6px 6px 0 var(--text);
      animation: spin 8s linear infinite;
      z-index: 2;
      opacity: 0.92;
    }

    .yarn::before,
    .yarn::after {
      content: "";
      position: absolute;
      left: 12px;
      top: 28px;
      border: 3px solid rgba(255,255,255,0.8);
      border-left: none;
      border-right: none;
      border-radius: 50%;
    }

    .yarn::before { width: 78px; height: 42px; transform: rotate(26deg); }
    .yarn::after { width: 82px; height: 50px; transform: rotate(-34deg); }

    @keyframes spin {
      from { transform: translateY(-50%) rotate(0deg); }
      to { transform: translateY(-50%) rotate(360deg); }
    }

    .hero-title {
      position: relative;
      z-index: 10;
      font-size: clamp(3rem, 12vw, 5.3rem);
      line-height: 1.05;
      color: var(--hot);
      text-shadow: 4px 4px 0 var(--cream), 7px 7px 0 var(--text);
      animation: pop 1.6s ease-in-out infinite alternate;
    }

    .hero-title .line1 {
      display: block;
      font-family: 'Pacifico', cursive;
      font-weight: 400;
    }

    .hero-title .line2 {
      display: block;
      margin-top: -4px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text);
      text-transform: uppercase;
      text-shadow: 3px 3px 0 var(--soft);
    }

    @keyframes pop {
      from { transform: scale(1) rotate(-1deg); }
      to { transform: scale(1.03) rotate(1deg); }
    }

    @media(max-width: 520px) {
      .yarn { display: none; }
      .card { min-height: 330px; padding: 44px 22px 34px; border-radius: 28px; }
      .cat-head { width: 178px; height: 124px; top: -102px; }
      .cat-head::before,
      .cat-head::after { width: 58px; height: 58px; top: -27px; }
      .cat-eyes { width: 94px; font-size: 1.65rem; }
    }
  </style>
</head>

<body>
  <div id="particles"></div>

  <main class="stage">
    <div class="cat-head">
      <div class="cat-face">
        <div class="cat-eyes"><span>◕</span><span>◕</span></div>
        <div class="cat-nose"></div>
        <div class="cat-mouth">ᵕ ᴥ ᵕ</div>
      </div>
    </div>

    <section class="card">
      <div class="paw tl">🐾</div>
      <div class="paw tr">🐾</div>
      <div class="paw bl">🐾</div>
      <div class="paw br">🐾</div>
      <div class="yarn"></div>

      <h1 class="hero-title">
        <span class="line1">Төрсөн өдрийн</span>
        <span class="line2">мэнд хүргэе!</span>
      </h1>
    </section>
  </main>

  <script>
    const pContainer = document.getElementById('particles');
    const items = ['🐾', '💗', '🎀', '✨', '🐱', '♡', '🌸', '🧶'];

    for (let i = 0; i < 36; i++) {
      const el = document.createElement('span');
      el.className = 'particle';
      el.textContent = items[Math.floor(Math.random() * items.length)];
      el.style.cssText = `
        left:${Math.random() * 100}vw;
        font-size:${Math.random() * 24 + 15}px;
        animation-duration:${Math.random() * 20 + 12}s;
        animation-delay:${Math.random() * 15}s;
      `;
      pContainer.appendChild(el);
    }
  </script>
</body>

</html>
