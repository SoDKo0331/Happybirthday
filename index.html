<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Төрсөн өдрийн мэнд хүргэе</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
  :root{
    --night:      #241328;
    --night-2:    #341a3d;
    --cream:      #fbeee0;
    --cream-dim:  #e8d3c2;
    --coral:      #ff8a5c;
    --gold:       #ffc266;
    --gold-dim:   #d9a44f;
    --flame:      #ffb347;
    --smoke:      #cfc3d6;
    --line:       rgba(251,238,224,0.14);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    min-height:100vh;
    display:grid;
    place-items:center;
    font-family:"Nunito", sans-serif;
    color:var(--cream);
    background:
      radial-gradient(ellipse 60% 40% at 50% 8%, rgba(255,194,102,0.10), transparent 60%),
      radial-gradient(ellipse 80% 60% at 15% 90%, rgba(255,138,92,0.08), transparent 60%),
      linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
    overflow:hidden;
    position:relative;
  }

  /* soft starfield */
  #stars{
    position:fixed; inset:0; z-index:0; pointer-events:none;
  }
  .star{
    position:absolute;
    width:3px; height:3px;
    background:var(--cream);
    border-radius:50%;
    opacity:.35;
    animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; }
    50%{ opacity:.75; }
  }

  .stage{
    position:relative;
    z-index:2;
    width:min(480px, 92vw);
    text-align:center;
    padding:20px 0 0;
  }

  .eyebrow{
    font-family:"Caveat", cursive;
    font-size:1.5rem;
    color:var(--gold);
    letter-spacing:.02em;
    margin-bottom:6px;
    opacity:.9;
  }

  .prompt{
    font-family:"Fraunces", serif;
    font-weight:600;
    font-size:clamp(1.35rem, 5vw, 1.7rem);
    color:var(--cream);
    line-height:1.35;
    margin-bottom:34px;
    min-height:2.7em;
    transition:opacity .4s ease;
  }

  /* ---------- CAKE ---------- */
  .cake-wrap{
    position:relative;
    display:flex;
    justify-content:center;
    margin-bottom:8px;
  }

  svg.cake{
    width:min(320px, 78vw);
    height:auto;
    overflow:visible;
  }

  .plate{ fill:none; stroke:var(--line); stroke-width:2; }
  .tier{ stroke:var(--night); stroke-width:2; }
  .tier-bottom{ fill:var(--coral); }
  .tier-top{ fill:#ffa374; }
  .icing{ fill:var(--cream); }
  .drip{ fill:var(--cream); }
  .sprinkle{ opacity:.9; }

  .candle-body{ fill:var(--gold); stroke:var(--night); stroke-width:1.5; }
  .candle-stripe{ fill:var(--cream); opacity:.55; }

  .wick{ stroke:#5b3a1a; stroke-width:2; stroke-linecap:round; }

  .flame-group{
    cursor:pointer;
    transform-origin:center bottom;
  }
  .flame-group:not(.blown) .flame{
    animation:flicker 1.4s ease-in-out infinite;
  }
  .flame{
    fill:var(--flame);
    filter:drop-shadow(0 0 6px rgba(255,179,71,.85)) drop-shadow(0 0 14px rgba(255,140,60,.5));
    transform-origin:center bottom;
    transition:opacity .25s ease, transform .25s ease;
  }
  @keyframes flicker{
    0%,100%{ transform:scaleY(1) rotate(-1.5deg); }
    50%{ transform:scaleY(1.08) rotate(2deg); }
  }
  .flame-group.blown .flame{
    opacity:0;
    transform:scaleY(0.2);
  }

  .smoke{
    opacity:0;
    fill:none;
    stroke:var(--smoke);
    stroke-width:2.4;
    stroke-linecap:round;
  }
  .flame-group.blown .smoke{
    animation:rise 1.4s ease-out forwards;
  }
  @keyframes rise{
    0%{ opacity:.7; transform:translateY(0) scale(.6); }
    100%{ opacity:0; transform:translateY(-26px) scale(1.3); }
  }

  .hint-ring{
    fill:none;
    stroke:var(--gold);
    stroke-width:1.5;
    opacity:0;
    transform-origin:center;
  }
  .flame-group:not(.blown):hover .hint-ring{
    opacity:.55;
    animation:pulseRing 1.2s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{ opacity:.6; transform:scale(.8); }
    100%{ opacity:0; transform:scale(1.6); }
  }

  /* ---------- reveal ---------- */
  .reveal{
    margin-top: 30px;
    opacity:0;
    transform:translateY(14px);
    transition:opacity .7s ease, transform .7s ease;
    pointer-events:none;
  }
  .reveal.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .headline{
    font-family:"Fraunces", serif;
    font-weight:700;
    font-size:clamp(2.1rem, 8vw, 3.1rem);
    line-height:1.08;
    color:var(--cream);
  }
  .headline .accent{
    display:block;
    font-family:"Caveat", cursive;
    font-weight:700;
    font-size:1.5em;
    color:var(--coral);
    margin-top:4px;
  }

  .rule{
    width:64px;
    height:2px;
    background:var(--gold-dim);
    margin:22px auto;
    opacity:.6;
  }

  .subline{
    font-size:1rem;
    color:var(--cream-dim);
    line-height:1.6;
    max-width:34ch;
    margin:0 auto;
  }

  /* confetti-ish falling shapes, only after reveal */
  #petals{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-5%;
    border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(340deg); }
  }

  @media (max-width:420px){
    .stage{ padding-top:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    .flame-group:not(.blown) .flame,
    .star,
    .flame-group:not(.blown):hover .hint-ring{
      animation:none;
    }
  }
</style>
</head>
<body>

<div id="stars"></div>
<div id="petals"></div>

<main class="stage">
  <p class="eyebrow">хамгийн онцгой өдөр</p>
  <p class="prompt" id="prompt">Лаа гурвыг үлээгээд унтраагаарай 🕯️</p>

  <div class="cake-wrap">
    <svg class="cake" viewBox="0 0 320 260" xmlns="http://www.w3.org/2000/svg">
      <ellipse class="plate" cx="160" cy="222" rx="118" ry="12"/>

      <!-- bottom tier -->
      <rect class="tier tier-bottom" x="60" y="150" width="200" height="64" rx="10"/>
      <path class="icing" d="M55 150
        q10 -14 22 0 q10 -14 22 0 q10 -14 22 0 q10 -14 22 0 q10 -14 22 0 q10 -14 22 0 q10 -14 22 0 q10 -14 22 0
        v14 h-200 z"/>

      <!-- top tier -->
      <rect class="tier tier-top" x="95" y="96" width="130" height="58" rx="9"/>
      <path class="icing" d="M92 96
        q9 -13 20 0 q9 -13 20 0 q9 -13 20 0 q9 -13 20 0 q9 -13 20 0 q9 -13 20 0
        v12 h-130 z"/>

      <!-- sprinkles -->
      <g class="sprinkle" fill="var(--gold)">
        <rect x="80" y="176" width="10" height="4" rx="2" transform="rotate(20 80 176)"/>
        <rect x="200" y="188" width="10" height="4" rx="2" transform="rotate(-15 200 188)"/>
        <rect x="150" y="172" width="10" height="4" rx="2" transform="rotate(40 150 172)"/>
      </g>
      <g class="sprinkle" fill="var(--night)">
        <rect x="110" y="184" width="9" height="4" rx="2" transform="rotate(-25 110 184)"/>
        <rect x="228" y="170" width="9" height="4" rx="2" transform="rotate(15 228 170)"/>
      </g>

      <!-- candles + flames: three interactive -->
      <g class="candle" transform="translate(120,58)">
        <rect class="candle-body" x="-6" y="0" width="12" height="40" rx="3"/>
        <rect class="candle-stripe" x="-6" y="10" width="12" height="5"/>
        <rect class="candle-stripe" x="-6" y="24" width="12" height="5"/>
        <line class="wick" x1="0" y1="0" x2="0" y2="-7"/>
        <g class="flame-group" data-candle="1" transform="translate(0,-8)">
          <circle class="hint-ring" cx="0" cy="-6" r="14"/>
          <path class="flame" d="M0 -20 C 7 -13 7 -3 0 2 C -7 -3 -7 -13 0 -20 Z"/>
          <path class="smoke" d="M-3 -10 Q 3 -18 -2 -26"/>
        </g>
      </g>

      <g class="candle" transform="translate(160,44)">
        <rect class="candle-body" x="-6" y="0" width="12" height="54" rx="3"/>
        <rect class="candle-stripe" x="-6" y="12" width="12" height="5"/>
        <rect class="candle-stripe" x="-6" y="30" width="12" height="5"/>
        <line class="wick" x1="0" y1="0" x2="0" y2="-7"/>
        <g class="flame-group" data-candle="2" transform="translate(0,-8)">
          <circle class="hint-ring" cx="0" cy="-6" r="14"/>
          <path class="flame" d="M0 -21 C 7.5 -14 7.5 -3 0 2 C -7.5 -3 -7.5 -14 0 -21 Z"/>
          <path class="smoke" d="M-3 -10 Q 3 -18 -2 -26"/>
        </g>
      </g>

      <g class="candle" transform="translate(200,58)">
        <rect class="candle-body" x="-6" y="0" width="12" height="40" rx="3"/>
        <rect class="candle-stripe" x="-6" y="10" width="12" height="5"/>
        <rect class="candle-stripe" x="-6" y="24" width="12" height="5"/>
        <line class="wick" x1="0" y1="0" x2="0" y2="-7"/>
        <g class="flame-group" data-candle="3" transform="translate(0,-8)">
          <circle class="hint-ring" cx="0" cy="-6" r="14"/>
          <path class="flame" d="M0 -20 C 7 -13 7 -3 0 2 C -7 -3 -7 -13 0 -20 Z"/>
          <path class="smoke" d="M-3 -10 Q 3 -18 -2 -26"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="reveal" id="reveal">
    <h1 class="headline">
      Төрсөн өдрийн мэнд хүргэе
      <span class="accent">хүсэл нь биелэх болтугай ✨</span>
    </h1>
    <div class="rule"></div>
    <p class="subline">Энэ шинэ жил чиний хувьд гэрэлтэй, эрч хүчтэй, инээд баясалтай байх болтугай.</p>
  </div>
</main>

<script>
  // stars
  const starsC = document.getElementById('stars');
  for(let i=0;i<46;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*3)+'s';
    starsC.appendChild(s);
  }

  const flameGroups = Array.from(document.querySelectorAll('.flame-group'));
  const prompt = document.getElementById('prompt');
  const reveal = document.getElementById('reveal');

  const prompts = [
    'Лаа гурвыг үлээгээд унтраагаарай 🕯️',
    'Сайн байна, дараагийнхыг нь дараарай 🕯️',
    'Сүүлчийнх! 🕯️',
    ''
  ];

  let blownCount = 0;

  function blowCandle(group){
    if(group.classList.contains('blown')) return;
    group.classList.add('blown');
    blownCount++;
    prompt.style.opacity = 0;
    setTimeout(()=>{
      prompt.textContent = prompts[blownCount];
      prompt.style.opacity = 1;
    }, 220);

    if(blownCount === flameGroups.length){
      setTimeout(revealMessage, 500);
    }
  }

  flameGroups.forEach(g=>{
    g.addEventListener('click', ()=> blowCandle(g));
    g.addEventListener('touchstart', (e)=>{ e.preventDefault(); blowCandle(g); }, {passive:false});
  });

  function revealMessage(){
    reveal.classList.add('show');
    launchConfetti();
    launchPetals();
  }

  function launchConfetti(){
    const duration = 2600;
    const end = Date.now() + duration;
    const colors = ['#ff8a5c', '#ffc266', '#fbeee0', '#ffa374'];
    (function frame(){
      confetti({ particleCount:4, angle:60, spread:55, origin:{x:0}, colors });
      confetti({ particleCount:4, angle:120, spread:55, origin:{x:1}, colors });
      if(Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  function launchPetals(){
    const wrap = document.getElementById('petals');
    const colors = ['#ff8a5c', '#ffc266', '#fbeee0'];
    for(let i=0;i<26;i++){
      const p = document.createElement('div');
      p.className = 'petal';
      const size = Math.random()*7+5;
      p.style.width = size+'px';
      p.style.height = size*0.4+'px';
      p.style.left = Math.random()*100+'vw';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration = (Math.random()*3+4)+'s';
      p.style.animationDelay = (Math.random()*1.2)+'s';
      wrap.appendChild(p);
      setTimeout(()=>p.remove(), 8000);
    }
  }
</script>

</body>
</html>
